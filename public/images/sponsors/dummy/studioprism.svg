<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 85" width="340" height="85" fill="none">
  <defs>
    <linearGradient id="grad-studioprism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
    <filter id="glow-studioprism" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g transform="translate(10, 8)" filter="url(#glow-studioprism)">
    <polygon points="40,12 65,55 15,55" stroke="url(#grad-studioprism)" stroke-width="3" fill="none"/><polygon points="40,26 55,52 25,52" fill="url(#grad-studioprism)" opacity="0.5"/>
  </g>
  <g transform="translate(90, 20)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">
      STUDIO PRISM
    </text>
    <text x="1" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#C084FC" letter-spacing="2.5" opacity="0.95">
      CREATIVE DESIGN HOUSE
    </text>
  </g>
</svg>
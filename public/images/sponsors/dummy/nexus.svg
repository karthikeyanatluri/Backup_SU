<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 85" width="340" height="85" fill="none">
  <defs>
    <linearGradient id="grad-nexus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    <filter id="glow-nexus" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g transform="translate(10, 8)" filter="url(#glow-nexus)">
    <polygon points="30,10 50,22 50,48 30,60 10,48 10,22" stroke="url(#grad-nexus)" stroke-width="4" fill="none"/><circle cx="30" cy="35" r="8" fill="url(#grad-nexus)"/><line x1="30" y1="10" x2="30" y2="27" stroke="#FFD700" stroke-width="2"/><line x1="50" y1="48" x2="37" y2="39" stroke="#FFD700" stroke-width="2"/><line x1="10" y1="48" x2="23" y2="39" stroke="#FFD700" stroke-width="2"/>
  </g>
  <g transform="translate(90, 20)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">
      NEXUS INNOVATIONS
    </text>
    <text x="1" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#FFD700" letter-spacing="2.5" opacity="0.95">
      GLOBAL TECH & VENTURES
    </text>
  </g>
</svg>
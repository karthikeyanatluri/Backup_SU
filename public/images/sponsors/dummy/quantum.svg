<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 85" width="340" height="85" fill="none">
  <defs>
    <linearGradient id="grad-quantum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow-quantum" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g transform="translate(10, 8)" filter="url(#glow-quantum)">
    <ellipse cx="40" cy="35" rx="28" ry="10" transform="rotate(30 40 35)" stroke="url(#grad-quantum)" stroke-width="3" fill="none"/><ellipse cx="40" cy="35" rx="28" ry="10" transform="rotate(-30 40 35)" stroke="url(#grad-quantum)" stroke-width="3" fill="none"/><circle cx="40" cy="35" r="6" fill="#60A5FA"/>
  </g>
  <g transform="translate(90, 20)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">
      QUANTUM DYNAMICS
    </text>
    <text x="1" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#60A5FA" letter-spacing="2.5" opacity="0.95">
      COMPUTING & SYSTEMS
    </text>
  </g>
</svg>
    <text x="2" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#F59E0B" letter-spacing="4.5" opacity="0.95">

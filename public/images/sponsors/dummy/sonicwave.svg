<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 85" width="340" height="85" fill="none">
  <defs>
    <linearGradient id="grad-sonicwave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow-sonicwave" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g transform="translate(10, 8)" filter="url(#glow-sonicwave)">
    <rect x="15" y="25" width="5" height="20" rx="2.5" fill="url(#grad-sonicwave)"/><rect x="25" y="15" width="5" height="40" rx="2.5" fill="url(#grad-sonicwave)"/><rect x="35" y="8" width="5" height="54" rx="2.5" fill="#10B981"/><rect x="45" y="18" width="5" height="34" rx="2.5" fill="url(#grad-sonicwave)"/><rect x="55" y="28" width="5" height="14" rx="2.5" fill="url(#grad-sonicwave)"/>
  </g>
  <g transform="translate(90, 20)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">
      SONICWAVE AUDIO
    </text>
    <text x="1" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#10B981" letter-spacing="2.5" opacity="0.95">
      ACOUSTIC LABS
    </text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 85" width="340" height="85" fill="none">
  <defs>
    <linearGradient id="grad-zenith" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow-zenith" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g transform="translate(10, 8)" filter="url(#glow-zenith)">
    <polygon points="40,10 47,28 65,30 50,42 55,60 40,49 25,60 30,42 15,30 33,28" stroke="url(#grad-zenith)" stroke-width="2.5" fill="none"/><circle cx="40" cy="35" r="5" fill="#34D399"/>
  </g>
  <g transform="translate(90, 20)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">
      ZENITH REFRESH
    </text>
    <text x="1" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#34D399" letter-spacing="2.5" opacity="0.95">
      BEVERAGE LABS
    </text>
  </g>
</svg>